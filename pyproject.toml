[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brender-archival"
version = "0.3.0"
description = "Run Argonaut's 1990s BRender engine on a modern PC and rebuild its 1998 source with a build anyone can rerun, plus research records on other historical engines."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "LICENSES/MIT-BRender.txt"]
authors = [{ name = "Zain Dana Harper" }]
keywords = ["brender", "game-engines", "rendering", "preservation", "archives", "provenance"]
dependencies = [
    "engine-revival @ git+https://github.com/HarperZ9/engine-revival@v0.12.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "packaging>=24"]
media = ["Pillow>=10"]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]
