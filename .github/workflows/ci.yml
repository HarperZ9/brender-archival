name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[test,media]"
      - run: python -m pytest -q

  records:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: every record carries the fields its schema names
        run: engine-revival validate
      - name: no restricted material is marked publishable
        run: engine-revival audit-public
      - name: the generated pages still regenerate to the same bytes
        run: |
          engine-revival report > /dev/null
          git diff --exit-code

  repo-art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: the drawings still match the spec they were rendered from
        run: python tools/check_repo_art.py
  art-receipts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify art receipt digests
        run: python3 scripts/check_art_receipts.py

  # The BRender ladder is the native result this repository exists to keep true.
  # It builds the pinned public BRender v1.3.2 source (MIT, Argonaut Software
  # Limited) out of tree, Win32 under MSVC, and runs every rung under CTest.
  # The source is fetched at run time and never committed here. The expected
  # rung count is fixed below so a ladder that silently shrinks fails.
  brender-native:
    runs-on: windows-latest
    env:
      BRENDER_COMMIT: d88d0ed41122664b9781015b517db64353e16f19
      EXPECTED_RUNGS: "21"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: fetch the pinned public BRender source
        shell: bash
        run: |
          src="$RUNNER_TEMP/brender-src"
          git init -q "$src"
          git -C "$src" remote add origin https://github.com/foone/BRender-v1.3.2.git
          git -C "$src" fetch -q --depth 1 origin "$BRENDER_COMMIT"
          git -C "$src" checkout -q FETCH_HEAD
          test "$(git -C "$src" rev-parse HEAD)" = "$BRENDER_COMMIT"
      - name: materialize the harness, build Win32, run the ladder
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $src = Join-Path $env:RUNNER_TEMP 'brender-src'
          $harness = Join-Path $env:RUNNER_TEMP 'brender-harness'
          $build = Join-Path $env:RUNNER_TEMP 'brender-build'
          engine-revival materialize-brender-harness --source-root $src --output-root $harness
          cmake -S $harness -B $build -A Win32 "-DBRENDER_SOURCE_DIR=$src"
          cmake --build $build --config Debug --parallel
          $listed = (ctest --test-dir $build -C Debug -N | Select-String 'Total Tests: (\d+)').Matches[0].Groups[1].Value
          if ($listed -ne $env:EXPECTED_RUNGS) { throw "ladder lists $listed rungs, expected $env:EXPECTED_RUNGS" }
          ctest --test-dir $build -C Debug --output-on-failure
      # The parity scenes on the period build (modern/parity/period), twice:
      # the 1998 render must give the same bytes on every run before any
      # comparison with BRender 1.4 means anything.
      - name: the period parity scenes are deterministic
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $src = Join-Path $env:RUNNER_TEMP 'brender-src'
          $harness = Join-Path $env:RUNNER_TEMP 'brender-harness'
          $build = Join-Path $env:RUNNER_TEMP 'parity-period'
          cmake -S modern/parity/period -B $build -A Win32 "-DBRENDER_HARNESS_DIR=$harness" "-DBRENDER_SOURCE_DIR=$src"
          cmake --build $build --config Debug --parallel --target parity_scene_period
          foreach ($run in 'a', 'b') {
            New-Item -ItemType Directory -Force "parity-period-$run" | Out-Null
            & "$build/Debug/parity_scene_period.exe" "$src/dat" "parity-period-$run" 2>$null | Out-Null
          }
          python modern/parity/parity_compare.py parity-period-a parity-period-b --label "period, two runs" --require-identical
          # The perspective-correct 8-bit scenes (fti8pizp.asm through the
          # engine-revival 0.7.0 port), on their own, so a regression names them.
          python modern/parity/parity_compare.py parity-period-a parity-period-b --label "period perspective scenes, two runs" --only persp,steep --require-identical
          # The 15/16-bit scenes (tt15/tt16_piz.asm, zb16p2ul.asm and t_piza.asm's
          # DBPP 2 instances through the engine-revival 0.8.0 ports), on their own.
          python modern/parity/parity_compare.py parity-period-a parity-period-b --label "period 15/16-bit scenes, two runs" --only rgb555,rgb565 --require-identical
      # The 1998 kernel for 24-bit lit textured triangles (t_piza.asm,
      # TrapezoidRenderPIZ2TIA_RGB_888) reads its RGB_888 shade table at a
      # 4-byte stride. PARITY_SHADE4=1 lays the table out at that stride, on
      # the period side only, so the rest of the kernel can be measured.
      - name: the period scenes with the shade table at the 1998 kernel's stride are deterministic
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $src = Join-Path $env:RUNNER_TEMP 'brender-src'
          $build = Join-Path $env:RUNNER_TEMP 'parity-period'
          $env:PARITY_SHADE4 = '1'
          foreach ($run in 'a', 'b') {
            New-Item -ItemType Directory -Force "parity-period-shade4-$run" | Out-Null
            & "$build/Debug/parity_scene_period.exe" "$src/dat" "parity-period-shade4-$run" 2>$null | Out-Null
          }
          python modern/parity/parity_compare.py parity-period-shade4-a parity-period-shade4-b --label "period, shade table at stride 4, two runs" --require-identical
      # The same scenes on the period build as a Pentium with MMX runs it
      # (engine-revival 0.9.0, harness option BRENDER_PENTPRIM_MMX): pentprim
      # swaps its whole 15/16-bit triangle table for the MMX table, which is
      # the 1998 path BRender 1.4 reproduces. Twice, and the 15/16-bit
      # scenes on their own.
      - name: the period parity scenes through the MMX table are deterministic
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $src = Join-Path $env:RUNNER_TEMP 'brender-src'
          $harness = Join-Path $env:RUNNER_TEMP 'brender-harness'
          $build = Join-Path $env:RUNNER_TEMP 'parity-period-mmx'
          cmake -S modern/parity/period -B $build -A Win32 "-DBRENDER_HARNESS_DIR=$harness" "-DBRENDER_SOURCE_DIR=$src" -DBRENDER_PENTPRIM_MMX=ON
          cmake --build $build --config Debug --parallel --target parity_scene_period
          foreach ($run in 'a', 'b') {
            New-Item -ItemType Directory -Force "parity-period-mmx-$run" | Out-Null
            & "$build/Debug/parity_scene_period.exe" "$src/dat" "parity-period-mmx-$run" 2>$null | Out-Null
          }
          python modern/parity/parity_compare.py parity-period-mmx-a parity-period-mmx-b --label "period through the MMX table, two runs" --require-identical
          python modern/parity/parity_compare.py parity-period-mmx-a parity-period-mmx-b --label "period 15/16-bit scenes through the MMX table, two runs" --only rgb555,rgb565 --require-identical
          # The z-sorted and TIP256 scenes (engine-revival 0.10.0), on their own.
          python modern/parity/parity_compare.py parity-period-a parity-period-b --label "period z-sorted and TIP256 scenes, two runs" --only zs,tip --require-identical
          # Only the 15/16-bit table changes: every other scene is the general build's.
          python modern/parity/parity_compare.py parity-period-a parity-period-mmx-a --label "the MMX build leaves the other scenes alone" --skip rgb555,rgb565 --require-identical
      - uses: actions/upload-artifact@v4
        with:
          name: parity-period
          path: parity-period-a
      - uses: actions/upload-artifact@v4
        with:
          name: parity-period-shade4
          path: parity-period-shade4-a
      - uses: actions/upload-artifact@v4
        with:
          name: parity-period-mmx
          path: parity-period-mmx-a

  # The same 21 programs against BRender 1.4 from BlazingRenderer/BRender
  # (MIT), built 64-bit. modern/ladder64/make_ladder64.py documents the two
  # bridges: the 1.3.2 colour macro, and the renderer rung written for the
  # 1.4 renderer API. The BlazingRenderer commit matches modern/CMakeLists.txt.
  ladder64:
    runs-on: windows-latest
    env:
      BRENDER_COMMIT: d88d0ed41122664b9781015b517db64353e16f19
      BLAZINGRENDERER_COMMIT: ed5e7a911e394b58803dca681a34f1864431f9d7
      EXPECTED_RUNGS: "21"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: fetch the pinned sources
        shell: bash
        run: |
          git config --global core.autocrlf false
          for pair in "brender-src https://github.com/foone/BRender-v1.3.2.git $BRENDER_COMMIT" \
                      "blazingrenderer https://github.com/BlazingRenderer/BRender.git $BLAZINGRENDERER_COMMIT"; do
            set -- $pair
            git init -q "$RUNNER_TEMP/$1"
            git -C "$RUNNER_TEMP/$1" remote add origin "$2"
            git -C "$RUNNER_TEMP/$1" fetch -q --depth 1 origin "$3"
            git -C "$RUNNER_TEMP/$1" checkout -q FETCH_HEAD
            test "$(git -C "$RUNNER_TEMP/$1" rev-parse HEAD)" = "$3"
          done
      - name: build the ladder 64-bit and run it
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $src = Join-Path $env:RUNNER_TEMP 'brender-src'
          $br14 = Join-Path $env:RUNNER_TEMP 'blazingrenderer'
          $harness = Join-Path $env:RUNNER_TEMP 'harness'
          $ladder = Join-Path $env:RUNNER_TEMP 'ladder64'
          $build = Join-Path $env:RUNNER_TEMP 'ladder64-build'
          engine-revival materialize-brender-harness --source-root $src --output-root $harness
          python modern/ladder64/make_ladder64.py $harness $ladder
          cmake -S $ladder -B $build -A x64 "-DBLAZINGRENDERER_SOURCE_DIR=$br14" "-DBRENDER_SOURCE_DIR=$src"
          cmake --build $build --config Release --parallel
          $listed = (ctest --test-dir $build -C Release -N | Select-String 'Total Tests: (\d+)').Matches[0].Groups[1].Value
          if ($listed -ne $env:EXPECTED_RUNGS) { throw "ladder lists $listed rungs, expected $env:EXPECTED_RUNGS" }
          ctest --test-dir $build -C Release --output-on-failure

  # brview, the sample viewer, builds from modern/ and loads every bundled
  # model headless (SDL offscreen video, software fallback).
  brview:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: shader tools for the OpenGL driver (glslang, spirv-cross)
        shell: pwsh
        run: |
          vcpkg install glslang[tools]:x64-windows spirv-cross:x64-windows
          $tools = Join-Path $env:VCPKG_INSTALLATION_ROOT 'installed/x64-windows/tools'
          foreach ($exe in 'glslang.exe', 'spirv-cross.exe') {
            $hit = Get-ChildItem -Path $tools -Recurse -Filter $exe | Select-Object -First 1
            if (-not $hit) { throw "vcpkg did not install $exe" }
            Add-Content $env:GITHUB_PATH $hit.DirectoryName
          }
      - name: build
        run: |
          cmake -S modern -B build -A x64
          cmake --build build --config Release --parallel
      - name: every bundled model loads
        shell: pwsh
        env:
          SDL_VIDEODRIVER: offscreen
          BRVIEW_SMOKE: "1"
        run: |
          $out = & build/Release/brview.exe 2>&1 | Out-String
          Write-Output $out
          if ($LASTEXITCODE -ne 0) { throw "brview smoke exited $LASTEXITCODE" }
          if ($out -notmatch 'brview smoke: 8 scenes, 0 failed to load, run ok') { throw "unexpected smoke result" }
      - name: the game slice opens every node of its script
        shell: pwsh
        env:
          SDL_VIDEODRIVER: offscreen
          KEEPERS_SMOKE: "1"
        run: |
          $out = & build/keepers-hour/Release/keepers-hour.exe 2>&1 | Out-String
          Write-Output $out
          if ($LASTEXITCODE -ne 0) { throw "keepers smoke exited $LASTEXITCODE" }
          if ($out -notmatch 'keepers smoke: 5 rooms entered, \d+ nodes opened, 0 problems, run ok') { throw "unexpected game smoke result" }
          if ($out -notmatch 'keepers endings: 3 of 3 reached, save ok') { throw "an ending or the save round trip failed" }
          if ($out -notmatch 'keepers audio: peak 0\.\d+, rms 0\.\d+, 0 clipped samples') { throw "the mixer clipped or was silent" }
          if ($out -notmatch 'keepers options: rebind, display and save ok') { throw "rebinding or saving options failed" }
      # Pixel size, widescreen and field of view, checked on frames: see
      # games/keepers-hour/tools/display_check.py for the claims and controls.
      - name: the display options do what they say
        shell: pwsh
        env:
          SDL_VIDEODRIVER: offscreen
        run: |
          python games/keepers-hour/tools/display_check.py build/keepers-hour/Release/keepers-hour.exe --stills stills-windows
          if ($LASTEXITCODE -ne 0) { throw "a display check failed" }
          python games/keepers-hour/tools/display_check.py build/Release/brview.exe --program brview --stills stills-windows
          if ($LASTEXITCODE -ne 0) { throw "a brview display check failed" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: display-stills-windows
          path: stills-windows
      # The parity scenes on BRender 1.4's software rasteriser (modern/parity).
      - name: the parity scenes are deterministic on Windows
        shell: pwsh
        env:
          SDL_VIDEODRIVER: offscreen
        run: |
          foreach ($run in 'a', 'b') {
            New-Item -ItemType Directory -Force "parity-windows-$run" | Out-Null
            & build/Release/parity-scene.exe build/_deps/brender132-src/dat "parity-windows-$run" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "parity-scene exited $LASTEXITCODE" }
          }
          python modern/parity/parity_compare.py parity-windows-a parity-windows-b --label "windows, two runs" --require-identical
          if ($LASTEXITCODE -ne 0) { throw "the parity scenes differ between runs" }
      - uses: actions/upload-artifact@v4
        with:
          name: parity-windows
          path: parity-windows-a
      # The same scenes on BRender 1.4 built with BRender 1.3.2's sine and
      # cosine (PARITY_PERIOD_SINE, modern/parity/period-sine.cmake). The
      # last pixels between the period and modern frames come from the two
      # versions' trig; with the same trig the frames are the same bytes.
      - name: build the parity scene against BRender 1.4 with BRender 1.3.2's sine
        run: |
          cmake -S modern -B build-sine -A x64 -DPARITY_PERIOD_SINE=ON
          cmake --build build-sine --config Release --parallel --target parity-scene
      - name: the parity scenes on BRender 1.4 with BRender 1.3.2's sine
        shell: pwsh
        env:
          SDL_VIDEODRIVER: offscreen
        run: |
          New-Item -ItemType Directory -Force parity-windows-sine | Out-Null
          & build-sine/Release/parity-scene.exe build/_deps/brender132-src/dat parity-windows-sine | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "parity-scene exited $LASTEXITCODE" }
      - uses: actions/upload-artifact@v4
        with:
          name: parity-windows-sine
          path: parity-windows-sine
      - name: the frame recorder is deterministic and the lamp moves
        shell: pwsh
        env:
          SDL_VIDEODRIVER: offscreen
          KEEPERS_SECONDS: "0.2"
          KEEPERS_YAW_SPEED: "30"
        run: |
          foreach ($run in 'a', 'b') {
            $env:KEEPERS_RECORD = Join-Path $env:RUNNER_TEMP "rec-$run"
            & build/keepers-hour/Release/keepers-hour.exe | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "recording $run exited $LASTEXITCODE" }
          }
          $a = Get-ChildItem (Join-Path $env:RUNNER_TEMP 'rec-a') -Filter *.ppm | Sort-Object Name
          $b = Get-ChildItem (Join-Path $env:RUNNER_TEMP 'rec-b') -Filter *.ppm | Sort-Object Name
          if ($a.Count -ne 6 -or $b.Count -ne 6) { throw "expected 6 frames, got $($a.Count) and $($b.Count)" }
          for ($i = 0; $i -lt 6; $i++) {
            if ((Get-FileHash $a[$i].FullName).Hash -ne (Get-FileHash $b[$i].FullName).Hash) { throw "frame $i differs between runs" }
          }
          for ($i = 1; $i -lt 6; $i++) {
            if ((Get-FileHash $a[$i].FullName).Hash -eq (Get-FileHash $a[$i - 1].FullName).Hash) { throw "frame $i repeats the one before: nothing moved, or a stale readback" }
          }

  # The same programs on 64-bit Linux: brview, the game and the 21-step
  # ladder, built with GCC and Ninja from the pins in modern/CMakeLists.txt.
  # The packaged copies must find libSDL3.so.0 beside themselves ($ORIGIN),
  # with nothing installed system-wide.
  linux:
    runs-on: ubuntu-24.04
    env:
      BRENDER_COMMIT: d88d0ed41122664b9781015b517db64353e16f19
      BLAZINGRENDERER_COMMIT: ed5e7a911e394b58803dca681a34f1864431f9d7
      EXPECTED_RUNGS: "21"
      SDL_VIDEODRIVER: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build dependencies
        run: bash scripts/linux-build-deps.sh
      - name: build brview and the game
        run: |
          cmake -S modern -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 4
      - name: every bundled model loads
        shell: bash
        run: |
          out=$(BRVIEW_SMOKE=1 ./build/brview 2>&1)
          echo "$out"
          grep -q 'brview smoke: 8 scenes, 0 failed to load, run ok' <<<"$out"
      - name: the game opens every room, node and ending
        shell: bash
        run: |
          out=$(cd build/keepers-hour && KEEPERS_SMOKE=1 ./keepers-hour 2>&1)
          echo "$out"
          grep -Eq 'keepers smoke: 5 rooms entered, [0-9]+ nodes opened, 0 problems, run ok' <<<"$out"
          grep -q 'keepers endings: 3 of 3 reached, save ok' <<<"$out"
          grep -Eq 'keepers audio: peak 0\.[0-9]+, rms 0\.[0-9]+, 0 clipped samples' <<<"$out"
          grep -q 'keepers options: rebind, display and save ok' <<<"$out"
      - name: the display options do what they say, on both renderers
        run: |
          python games/keepers-hour/tools/display_check.py build/keepers-hour/keepers-hour --stills stills-linux
          python games/keepers-hour/tools/display_check.py build/keepers-hour/keepers-hour --opengl
          python games/keepers-hour/tools/display_check.py build/brview --program brview --stills stills-linux
          python games/keepers-hour/tools/display_check.py build/brview --program brview --opengl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: display-stills-linux
          path: stills-linux
      # BRender 1.4's OpenGL driver (Mesa llvmpipe here) against its software
      # rasteriser, on every brview model (modern/parity/gl_vs_software.py).
      # Bounds from the first measurement (16 October 2026, WSL Ubuntu 24.04
      # llvmpipe), so calibrated, not predicted: unlit IoU >= 0.9774, identical
      # >= 0.9774, MAD <= 4.21; textured unlit IoU >= 0.9929, identical
      # >= 0.7829, MAD <= 4.32. Lit stills are reported: the two light
      # differently. The OpenGL stills must repeat byte for byte.
      - name: OpenGL and the software rasteriser draw the same models within the recorded bounds
        run: python3 modern/parity/gl_vs_software.py build/brview --bounds-unlit 0.975 0.975 4.5 --bounds-textured 0.99 0.77 4.5 --require-identical-runs --out gl-vs-software/result.json --stills gl-vs-software
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gl-vs-software
          path: gl-vs-software
      # The Vulkan backend, stage A (docs/adr/0002-vulkan-backend.md): one
      # headless rasteriser on Mesa's lavapipe (a CPU Vulkan device, forced so
      # no GPU is used) against BRender 1.4's software rasteriser, on the same
      # screen-space triangles. Bounds from the first measurement (17 October
      # 2026, WSL Ubuntu 24.04 lavapipe), so calibrated, not predicted:
      # coverage IoU >= 0.9137 (slivers; 0.9897 and up otherwise), colour
      # within one level on >= 99.75% of the pixels both draw, MAD <= 13.95.
      - name: Vulkan (lavapipe) and the software rasteriser draw the same triangles within the recorded bounds
        shell: bash
        env:
          VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.json
          VKO_DEVICE_TYPE: cpu
        run: |
          set -euo pipefail
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends libvulkan-dev mesa-vulkan-drivers
          cmake -S modern -B build -DBRENDER_VULKAN=ON
          cmake --build build --target vk-triangle
          for run in a b; do
            mkdir -p vk-$run/software vk-$run/vulkan
            ./build/vk-triangle vk-$run
          done
          diff -r vk-a vk-b
          python3 modern/vulkan/vk_compare.py vk-a --bounds 0.91 0.997 14.5 --out vk-a/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vulkan-triangle
          path: vk-a
      # Stage B: vkprim, a primitive library under softrend whose triangles
      # Vulkan rasterises from softprim's own screen-space vertices, against
      # softprim on the same untextured scenes. Bounds from the first
      # measurement (17 October 2026, WSL lavapipe), so calibrated, not
      # predicted: coverage IoU >= 0.9764 (teapot), >= 27.5% identical (the
      # Gouraud scenes; flat scenes are identical wherever both draw),
      # MAD <= 2.81.
      - name: vkprim (Vulkan under softrend) and softprim draw the same scenes within the recorded bounds
        shell: bash
        env:
          VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.json
          VKO_DEVICE_TYPE: cpu
        run: |
          set -euo pipefail
          cmake --build build --target vk-scenes
          for run in a b; do
            mkdir -p vkp-$run vkp-soft
            ./build/vk-scenes build/_deps/brender132-src/dat vkp-$run vulkan
          done
          ./build/vk-scenes build/_deps/brender132-src/dat vkp-soft software
          diff -r vkp-a vkp-b
          python3 modern/parity/parity_compare.py vkp-soft vkp-a --label "softprim against vkprim (lavapipe)" --bounds 0.975 0.25 255 3.0 --out vkp-a/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vulkan-vkprim
          path: |
            vkp-a
            vkp-soft
      # Both renderers. A stale OpenGL readback shows up as a frame that
      # repeats the one before it, so no two neighbouring frames may match.
      - name: the frame recorder is deterministic and the lamp moves, on both renderers
        shell: bash
        env:
          KEEPERS_SECONDS: "0.2"
          KEEPERS_YAW_SPEED: "30"
        run: |
          for mode in software opengl; do
            flag=""; [ "$mode" = software ] && flag=--force-software
            for run in a b; do
              KEEPERS_RECORD="$RUNNER_TEMP/rec-$mode-$run" ./build/keepers-hour/keepers-hour $flag > /dev/null
              (cd "$RUNNER_TEMP/rec-$mode-$run" && sha256sum frame-*.ppm) > "$mode-$run.sum"
            done
            test "$(wc -l < "$mode-a.sum")" -eq 6
            diff "$mode-a.sum" "$mode-b.sum"
            test "$(cut -d' ' -f1 "$mode-a.sum" | uniq | wc -l)" -eq 6 || { echo "$mode: a frame repeats the one before"; exit 1; }
          done
      - name: the parity scenes are deterministic on Linux
        run: |
          for run in a b; do
            mkdir -p "parity-linux-$run"
            ./build/parity-scene build/_deps/brender132-src/dat "parity-linux-$run" > /dev/null
          done
          python modern/parity/parity_compare.py parity-linux-a parity-linux-b --label "linux, two runs" --require-identical
      - uses: actions/upload-artifact@v4
        with:
          name: parity-linux
          path: parity-linux-a
      - name: the packaged copies run in place
        shell: bash
        run: |
          cmake --install build --prefix stage/brview --component Unspecified
          cmake --install build --prefix stage --component keepers
          test ! -e stage/brview/keepers-hour
          for exe in stage/brview/brview stage/keepers-hour/keepers-hour; do
            ldd "$exe" | grep -q "libSDL3.so.0 => $PWD/$(dirname "$exe")/libSDL3.so.0"
          done
          cd "$RUNNER_TEMP"
          out=$(BRVIEW_SMOKE=1 "$GITHUB_WORKSPACE/stage/brview/brview" 2>&1)
          grep -q '0 failed to load, run ok' <<<"$out"
          out=$(KEEPERS_SMOKE=1 "$GITHUB_WORKSPACE/stage/keepers-hour/keepers-hour" 2>&1)
          grep -q '3 of 3 reached, save ok' <<<"$out"
      # The AppImages are built from the same staged folders and run without
      # FUSE (--appimage-extract-and-run), from outside the build tree.
      - name: the AppImages run
        shell: bash
        run: |
          python3 packaging/appimage/ppm_to_png.py games/keepers-hour/data/art/painting-tower.ppm keepers.png
          bash packaging/appimage/build-appimage.sh stage/keepers-hour keepers-hour "The Keeper's Hour" keepers.png keepers.AppImage
          bash packaging/appimage/build-appimage.sh stage/brview brview "brview" docs/brand/mark-512.png brview.AppImage
          cd "$RUNNER_TEMP"
          out=$(KEEPERS_SMOKE=1 "$GITHUB_WORKSPACE/keepers.AppImage" --appimage-extract-and-run 2>&1)
          grep -q '3 of 3 reached, save ok' <<<"$out"
          grep -q '0 problems, run ok' <<<"$out"
          out=$(BRVIEW_SMOKE=1 "$GITHUB_WORKSPACE/brview.AppImage" --appimage-extract-and-run 2>&1)
          grep -q '0 failed to load, run ok' <<<"$out"
      - name: fetch the pinned sources for the ladder
        shell: bash
        run: |
          for pair in "brender-src https://github.com/foone/BRender-v1.3.2.git $BRENDER_COMMIT" \
                      "blazingrenderer https://github.com/BlazingRenderer/BRender.git $BLAZINGRENDERER_COMMIT"; do
            set -- $pair
            git init -q "$RUNNER_TEMP/$1"
            git -C "$RUNNER_TEMP/$1" remote add origin "$2"
            git -C "$RUNNER_TEMP/$1" fetch -q --depth 1 origin "$3"
            git -C "$RUNNER_TEMP/$1" checkout -q FETCH_HEAD
            test "$(git -C "$RUNNER_TEMP/$1" rev-parse HEAD)" = "$3"
          done
      - name: build the ladder 64-bit and run it
        shell: bash
        run: |
          python -m pip install -e .
          engine-revival materialize-brender-harness --source-root "$RUNNER_TEMP/brender-src" --output-root "$RUNNER_TEMP/harness"
          python modern/ladder64/make_ladder64.py "$RUNNER_TEMP/harness" "$RUNNER_TEMP/ladder64"
          cmake -S "$RUNNER_TEMP/ladder64" -B "$RUNNER_TEMP/ladder64-build" -G Ninja -DCMAKE_BUILD_TYPE=Release \
            "-DBLAZINGRENDERER_SOURCE_DIR=$RUNNER_TEMP/blazingrenderer" "-DBRENDER_SOURCE_DIR=$RUNNER_TEMP/brender-src"
          cmake --build "$RUNNER_TEMP/ladder64-build" --parallel 4
          listed=$(ctest --test-dir "$RUNNER_TEMP/ladder64-build" -N | sed -n 's/^Total Tests: //p')
          test "$listed" = "$EXPECTED_RUNGS" || { echo "ladder lists $listed rungs, expected $EXPECTED_RUNGS"; exit 1; }
          ctest --test-dir "$RUNNER_TEMP/ladder64-build" --output-on-failure

  # BRender 1.4's software rasteriser, Windows MSVC against Linux GCC. The
  # bounds were set from the first measurement (16 October 2026: coverage
  # identical, at most 0.02% of pixels off by one level), so they are
  # calibrated, not predicted; modern/parity/evidence holds the record.
  parity:
    needs: [brview, linux, brender-native]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: parity-windows
          path: parity-windows
      - uses: actions/download-artifact@v4
        with:
          name: parity-linux
          path: parity-linux
      - name: the two builds draw the same scenes within the recorded bounds
        run: python3 modern/parity/parity_compare.py parity-windows parity-linux --label "windows against linux" --skip rgb555,rgb565 --bounds 1.0 0.999 1
      # With the shared angle (17 October 2026) a few Gouraud pixels round one
      # level apart between the Windows and Linux builds of BRender 1.4; at 15
      # and 16 bits one level of a 5-bit field is 8 or 9 levels once expanded.
      - name: the two builds draw the same 15/16-bit scenes within one level of the format
        run: python3 modern/parity/parity_compare.py parity-windows parity-linux --label "windows against linux, 15/16-bit" --only rgb555,rgb565 --bounds 1.0 0.999 9
      - uses: actions/download-artifact@v4
        with:
          name: parity-period
          path: parity-period
      # The 1998 rasteriser (BRender 1.3.2 through engine-revival's line-by-line
      # ports of tt24_piz.asm, t_piza.asm, zb8.asm and fti8_piz.asm) against
      # BRender 1.4. Bounds from the first measurements (16 October 2026), so
      # calibrated, not predicted: 24-bit untextured IoU >= 0.9993, >= 90.7%
      # identical, MAD <= 0.18; 24-bit textured IoU >= 0.9992, >= 95.6%
      # identical, MAD <= 1.09; 8-bit untextured IoU >= 0.9986, >= 98.3% of
      # indices identical, MAD <= 0.26; 8-bit textured IoU >= 0.9983, >= 96.4%,
      # MAD <= 0.43. The 24-bit lit textured scenes are reported, not bounded:
      # the 1998 kernel reads its shade table at the wrong stride (README).
      - name: the 1998 and modern rasterisers draw the same untextured scenes within the recorded bounds
        run: python3 modern/parity/parity_compare.py parity-linux parity-period --label "modern against period, untextured" --skip textured,index8,rgb555,rgb565,zs --bounds 1.0 0.999 1 0.01
      - name: the 1998 and modern rasterisers draw the same textured scenes within the recorded bounds
        run: python3 modern/parity/parity_compare.py parity-linux parity-period --label "modern against period, textured" --only textured --skip lit,index8,rgb555,rgb565,zs --require-identical
      - name: the 1998 and modern rasterisers draw the same 8-bit untextured scenes within the recorded bounds
        run: python3 modern/parity/parity_compare.py parity-linux parity-period --label "modern against period, 8-bit untextured" --only index8 --skip textured --require-identical
      - name: the 1998 and modern rasterisers draw the same 8-bit textured scenes within the recorded bounds
        run: python3 modern/parity/parity_compare.py parity-linux parity-period --label "modern against period, 8-bit textured" --only textured-index8,textured-lit-index8 --max-differ 1
      # Perspective-correct 8-bit texturing (BR_MATF_PERSPECTIVE; fti8pizp.asm
      # and pfpsetup.asm through engine-revival 0.7.0), with the steep plane
      # drawn without perspective beside it. Measured 17 October 2026 (WSL
      # Linux and Windows modern give the same frames): IoU >= 0.9983,
      # >= 92.59% of indices identical, MAD <= 1.713. The plane scores the
      # same with and without perspective (README), so calibrated, not
      # predicted.
      # --max-differ 1: --require-identical used to compare the rounded share
      # of identical pixels, so one pixel in 20,000 passed as identical. Counted
      # exactly, the lit sphere differs in one pixel by one index here and in
      # the 8-bit textured gate (17 October 2026; README).
      - name: the 1998 and modern rasterisers draw the same perspective-correct 8-bit scenes within the recorded bounds
        run: python3 modern/parity/parity_compare.py parity-linux parity-period --label "modern against period, 8-bit perspective" --only persp,steep --skip rgb5,map --max-differ 1
      - name: the 24-bit lit textured scenes, reported
        run: python3 modern/parity/parity_compare.py parity-linux parity-period --label "modern against period, 24-bit lit textured (1998 stride defect)" --only textured-lit --skip index8,rgb555,rgb565,zs
      # 15/16-bit (RGB_555, RGB_565; engine-revival 0.8.0). The two sides use
      # different 1998 kernel families here: BRender 1.4 reproduces pentprim's
      # MMX path, which replaces the whole 15/16-bit table when the CPU has MMX,
      # and the period harness builds without MMX and uses the general tables
      # (README). Untextured, measured 17 October 2026 (Windows modern): IoU >=
      # 0.9869, >= 63.2% identical, MAD <= 2.081; bounded as calibrated. The
      # textured scenes are reported, not bounded: 1.4's MMX path draws them
      # untextured.
      - name: the 1998 and modern rasterisers draw the same untextured 15/16-bit scenes within the recorded bounds
        run: python3 modern/parity/parity_compare.py parity-linux parity-period --label "modern against period, 15/16-bit untextured" --only rgb555,rgb565 --skip textured,dither,zs,tip,mmxp --bounds 0.986 0.63 255 2.1
      - name: the textured 15/16-bit scenes, reported
        run: python3 modern/parity/parity_compare.py parity-linux parity-period --label "modern against period, 15/16-bit textured (1.4 draws the MMX path)" --only textured-rgb5,textured-gold-rgb5,textured-lit-rgb5
      - uses: actions/download-artifact@v4
        with:
          name: parity-period-shade4
          path: parity-period-shade4
      # With the table at the stride the 1998 kernel reads (PARITY_SHADE4=1),
      # the same scenes match. Measured 16 October 2026: IoU >= 0.9998,
      # >= 97.9% identical, MAD <= 0.272.
      - name: the 24-bit lit textured scenes match once the shade table sits at the 1998 kernel's stride
        run: python3 modern/parity/parity_compare.py parity-linux parity-period-shade4 --label "modern against period, 24-bit lit textured, shade table at stride 4" --only textured-lit --skip index8,rgb555,rgb565,zs --bounds 1.0 0.999 13 0.01
      - uses: actions/download-artifact@v4
        with:
          name: parity-period-mmx
          path: parity-period-mmx
      # 15/16-bit against the period build through the MMX table
      # (engine-revival 0.9.0), the 1998 path BRender 1.4 reproduces, so the
      # two sides run the same kernel family. Measured 17 October 2026: CI
      # frames, Linux modern against the Win32 period. Every class within its
      # measured bounds, calibrated, not predicted; fed 1.4's own vertices,
      # the MMX port reproduces 1.4's frames byte for byte (README), so the
      # residual is in the vertices.
      - name: the 1998 MMX path and modern draw the same untextured 15/16-bit scenes within the recorded bounds
        run: python3 modern/parity/parity_compare.py parity-linux parity-period-mmx --label "modern against period (MMX), 15/16-bit untextured" --only rgb555,rgb565 --skip textured,dither,zs,tip,mmxp --bounds 1.0 0.999 9 0.01
      - name: the 1998 MMX path and modern draw the 16-bit-map scenes the same, untextured on both sides
        run: python3 modern/parity/parity_compare.py parity-linux parity-period-mmx --label "modern against period (MMX), 15/16-bit maps the MMX table does not texture" --only textured-rgb5,textured-gold-rgb5,textured-lit-rgb5 --bounds 1.0 0.999 9 0.01
      - name: the 1998 MMX path and modern texture the 8-bit palette maps the same within the recorded bounds
        run: python3 modern/parity/parity_compare.py parity-linux parity-period-mmx --label "modern against period (MMX), 15/16-bit textured" --only textured-pal --skip dither --require-identical
      - name: the 1998 MMX path and modern dither the same within the recorded bounds
        run: python3 modern/parity/parity_compare.py parity-linux parity-period-mmx --label "modern against period (MMX), 15/16-bit dithered" --only dither --require-identical
      # Z-sorted (BrZsSceneRender) and the TIP256 perspective mappers
      # (engine-revival 0.10.0: tt15/tt16/tt24_pi.asm, t_pia.asm, t15_pip.asm,
      # t15_pizp.asm, and softrend's subdiv.asm), measured 17 October 2026
      # with the shared angle. BRender 1.4 draws z-sorted 15/16-bit through
      # the general tables (BlazingRenderer's fix, below), so the general
      # period build is its counterpart there: eight of the ten scenes are
      # byte-identical, and the Gouraud sphere differs in one pixel by one
      # level in each format. 1.4 has no TIP kernel: it draws the z-buffered TIP shapes
      # untextured through the MMX table and refuses the z-sorted ones, so
      # TIP is gated against the MMX build and otherwise reported. The MMX
      # perspective rows go through softrend's subdivision on both sides.
      - name: the 1998 and modern rasterisers draw the same z-sorted 15/16-bit scenes, to one pixel
        run: python3 modern/parity/parity_compare.py parity-linux parity-period --label "modern against period, 15/16-bit z-sorted" --only zs-rgb5 --skip tip --max-differ 1
      - name: the 1998 and modern rasterisers draw the same z-sorted 24-bit scenes within the recorded bounds
        run: python3 modern/parity/parity_compare.py parity-linux parity-period --label "modern against period, 24-bit z-sorted" --only flat-zs,smooth-zs,textured-zs --skip rgb5,lit --bounds 1.0 0.999 1 0.01
      - name: the z-sorted 24-bit lit textured scene, reported (1998 stride defect)
        run: python3 modern/parity/parity_compare.py parity-linux parity-period --label "modern against period, 24-bit z-sorted lit textured (1998 stride defect)" --only textured-lit-zs --skip rgb5
      - name: the z-sorted 24-bit lit textured scene matches once the shade table sits at the 1998 kernel's stride
        run: python3 modern/parity/parity_compare.py parity-linux parity-period-shade4 --label "modern against period, 24-bit z-sorted lit textured, shade table at stride 4" --only textured-lit-zs --skip rgb5 --require-identical
      - name: the TIP256 scenes through the general tables, reported (1.4 has no TIP kernel)
        run: python3 modern/parity/parity_compare.py parity-linux parity-period --label "modern against period, TIP256 (1.4 has no TIP kernel)" --only tip
      - name: the 1998 MMX path and modern draw the z-buffered TIP shapes the same, untextured on both sides
        run: python3 modern/parity/parity_compare.py parity-linux parity-period-mmx --label "modern against period (MMX), TIP shapes the MMX table does not texture" --only tip --skip zs --bounds 1.0 0.999 9 0.01
      - name: the 1998 MMX perspective rows and modern draw the same subdivided scenes within the recorded bounds
        run: python3 modern/parity/parity_compare.py parity-linux parity-period-mmx --label "modern against period (MMX), perspective rows, subdivided" --only mmxp --bounds 1.0 0.999 80 0.01
      - name: the z-sorted 15/16-bit scenes on the MMX build, reported (the 1998 MMX table takes them; 1.4 does not)
        run: python3 modern/parity/parity_compare.py parity-linux parity-period-mmx --label "modern against period (MMX), z-sorted (1998 MMX table takes them)" --only zs-rgb5
      # 8-bit textures on maps that are not 256 wide (engine-revival 0.11.0:
      # zb8p2unl.asm, zb8p2lit.asm and fti8pizp.asm's 32, 64, 128 and 1024
      # instances), on earth.pix and rosewood.pix resampled, measured 17
      # October 2026. Unlit, byte for byte; lit, the lit sphere's one pixel
      # that the two versions' sine accounts for (README).
      - name: the 1998 and modern rasterisers draw the same unlit 8-bit scenes on maps not 256 wide
        run: python3 modern/parity/parity_compare.py parity-linux parity-period --label "modern against period, 8-bit maps not 256 wide, unlit" --only map --skip lit --require-identical
      - name: the 1998 and modern rasterisers draw the same lit 8-bit scenes on maps not 256 wide, to one pixel
        run: python3 modern/parity/parity_compare.py parity-linux parity-period --label "modern against period, 8-bit maps not 256 wide, lit" --only lit-map,lit-persp-map,lit-steep-persp-map --max-differ 1
      # BRender 1.4 with BRender 1.3.2's sine and cosine (Windows) against the
      # period builds: byte for byte, every scene both versions draw the same
      # way. Left out, and gated above: the 24-bit lit textured scenes as
      # shipped (the 1998 stride defect; here at stride 4 instead), the TIP256
      # scenes on the general tables (1.4 has no TIP kernel) and the z-sorted
      # scenes on the MMX build (the 1998 MMX table takes them). The control
      # runs the first gate on BRender 1.4 as published and must fail.
      - uses: actions/download-artifact@v4
        with:
          name: parity-windows-sine
          path: parity-windows-sine
      - name: with the 1998 trig, BRender 1.4 draws the 24-bit and 8-bit scenes as the 1998 rasteriser does
        run: python3 modern/parity/parity_compare.py parity-windows-sine parity-period --label "modern with the 1998 sine against period, 24-bit and 8-bit" --skip rgb5,textured-lit --require-identical
      - name: with the 1998 trig, BRender 1.4 draws the 8-bit lit textured scenes as the 1998 rasteriser does
        run: python3 modern/parity/parity_compare.py parity-windows-sine parity-period --label "modern with the 1998 sine against period, 8-bit lit textured" --only textured-lit-index8,lit-persp,lit-steep,lit-map --require-identical
      - name: with the 1998 trig, BRender 1.4 draws the 24-bit lit textured scenes as the 1998 rasteriser does at stride 4
        run: python3 modern/parity/parity_compare.py parity-windows-sine parity-period-shade4 --label "modern with the 1998 sine against period, 24-bit lit textured, stride 4" --only textured-lit --skip index8,rgb5 --require-identical
      - name: with the 1998 trig, BRender 1.4 draws the z-sorted 15/16-bit scenes as the 1998 rasteriser does
        run: python3 modern/parity/parity_compare.py parity-windows-sine parity-period --label "modern with the 1998 sine against period, 15/16-bit z-sorted" --only zs-rgb5 --skip tip --require-identical
      - name: with the 1998 trig, BRender 1.4 draws the 15/16-bit scenes as the 1998 MMX path does
        run: python3 modern/parity/parity_compare.py parity-windows-sine parity-period-mmx --label "modern with the 1998 sine against period (MMX), 15/16-bit" --only rgb555,rgb565 --skip zs --require-identical
      - name: control, BRender 1.4 as published fails the first of those gates
        run: |
          if python3 modern/parity/parity_compare.py parity-windows parity-period --label "control: modern as published against period, 24-bit and 8-bit" --skip rgb5,textured-lit --require-identical; then
            echo "the gate passed on frames it must reject"; exit 1
          fi
