name: release-brview

# Builds brview for 64-bit Windows and attaches the zip and its SHA-256 to a
# GitHub release. Runs when a tag brview-v* is pushed.
on:
  push:
    tags: ["brview-v*"]

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: shader tools for the OpenGL driver (glslang, spirv-cross)
        shell: pwsh
        run: |
          vcpkg install glslang[tools]:x64-windows spirv-cross:x64-windows
          $tools = Join-Path $env:VCPKG_INSTALLATION_ROOT 'installed/x64-windows/tools'
          foreach ($exe in 'glslang.exe', 'spirv-cross.exe') {
            $hit = Get-ChildItem -Path $tools -Recurse -Filter $exe | Select-Object -First 1
            if (-not $hit) { throw "vcpkg did not install $exe" }
            Add-Content $env:GITHUB_PATH $hit.DirectoryName
          }
      - name: build
        run: |
          cmake -S modern -B build -A x64
          cmake --build build --config Release --parallel
          cmake --install build --config Release --prefix stage/brview
      - name: licences and quickstart
        shell: pwsh
        run: |
          Copy-Item modern/QUICKSTART.txt stage/brview/
          New-Item -ItemType Directory stage/brview/licences | Out-Null
          Copy-Item LICENSE stage/brview/licences/brview-MIT.txt
          Copy-Item LICENSES/MIT-BRender.txt stage/brview/licences/BRender-1.3.2-MIT.txt
          Copy-Item LICENSES/MIT-BlazingRenderer.txt stage/brview/licences/BlazingRenderer-MIT.txt
          Copy-Item LICENSES/Zlib-SDL3.txt stage/brview/licences/SDL3-Zlib.txt
      - name: the packaged viewer loads every model
        shell: pwsh
        env:
          SDL_VIDEODRIVER: offscreen
          BRVIEW_SMOKE: "1"
        run: |
          $out = & stage/brview/brview.exe 2>&1 | Out-String
          Write-Output $out
          if ($LASTEXITCODE -ne 0 -or $out -notmatch '0 failed to load, run ok') { throw "packaged smoke failed" }
      - name: zip, hash and publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $name = "brview-$($env:GITHUB_REF_NAME -replace '^brview-v','')-windows-x64.zip"
          Compress-Archive -Path stage/brview -DestinationPath $name
          $hash = (Get-FileHash $name -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText((Join-Path $PWD "$name.sha256"), "$hash  $name`n")
          gh release upload $env:GITHUB_REF_NAME $name "$name.sha256" --clobber
