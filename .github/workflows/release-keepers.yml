name: release-keepers

# Builds The Keeper's Hour for 64-bit Windows and 64-bit Linux and attaches
# the zip, the tarball and their SHA-256 files to the GitHub release of a
# keepers-v* tag.
on:
  push:
    tags: ["keepers-v*"]

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: shader tools for the OpenGL driver (glslang, spirv-cross)
        shell: pwsh
        run: |
          vcpkg install glslang[tools]:x64-windows spirv-cross:x64-windows
          $tools = Join-Path $env:VCPKG_INSTALLATION_ROOT 'installed/x64-windows/tools'
          foreach ($exe in 'glslang.exe', 'spirv-cross.exe') {
            $hit = Get-ChildItem -Path $tools -Recurse -Filter $exe | Select-Object -First 1
            if (-not $hit) { throw "vcpkg did not install $exe" }
            Add-Content $env:GITHUB_PATH $hit.DirectoryName
          }
      - name: build
        run: |
          cmake -S modern -B build -A x64
          cmake --build build --config Release --parallel --target keepers-hour
          cmake --install build --config Release --prefix stage --component keepers
      - name: licences and quickstart
        shell: pwsh
        run: |
          Copy-Item games/keepers-hour/QUICKSTART.txt stage/keepers-hour/
          Copy-Item games/keepers-hour/CREDITS.txt stage/keepers-hour/
          New-Item -ItemType Directory stage/keepers-hour/licences | Out-Null
          Copy-Item LICENSE stage/keepers-hour/licences/code-MIT.txt
          Copy-Item LICENSES/CC-BY-4.0.txt stage/keepers-hour/licences/words-and-art-CC-BY-4.0.txt
          Copy-Item LICENSES/MIT-BlazingRenderer.txt stage/keepers-hour/licences/BlazingRenderer-MIT.txt
          Copy-Item LICENSES/MIT-BRender.txt stage/keepers-hour/licences/BRender-1.3.2-MIT.txt
          Copy-Item LICENSES/Zlib-SDL3.txt stage/keepers-hour/licences/SDL3-Zlib.txt
      - name: the packaged game opens every room, node and ending
        shell: pwsh
        env:
          SDL_VIDEODRIVER: offscreen
          KEEPERS_SMOKE: "1"
        run: |
          $out = & stage/keepers-hour/keepers-hour.exe 2>&1 | Out-String
          Write-Output $out
          if ($LASTEXITCODE -ne 0 -or $out -notmatch '0 problems, run ok' -or $out -notmatch '3 of 3 reached, save ok') { throw "packaged smoke failed" }
      - name: zip, hash and publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $name = "keepers-hour-$($env:GITHUB_REF_NAME -replace '^keepers-v','')-windows-x64.zip"
          Compress-Archive -Path stage/keepers-hour -DestinationPath $name
          $hash = (Get-FileHash $name -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText((Join-Path $PWD "$name.sha256"), "$hash  $name`n")
          gh release upload $env:GITHUB_REF_NAME $name "$name.sha256" --clobber

  linux-x64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: build dependencies
        run: bash scripts/linux-build-deps.sh
      - name: build
        run: |
          cmake -S modern -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 4 --target keepers-hour
          cmake --install build --prefix stage --component keepers
      - name: licences and quickstart
        run: |
          cp games/keepers-hour/QUICKSTART.txt games/keepers-hour/CREDITS.txt stage/keepers-hour/
          mkdir stage/keepers-hour/licences
          cp LICENSE stage/keepers-hour/licences/code-MIT.txt
          cp LICENSES/CC-BY-4.0.txt stage/keepers-hour/licences/words-and-art-CC-BY-4.0.txt
          cp LICENSES/MIT-BlazingRenderer.txt stage/keepers-hour/licences/BlazingRenderer-MIT.txt
          cp LICENSES/MIT-BRender.txt stage/keepers-hour/licences/BRender-1.3.2-MIT.txt
          cp LICENSES/Zlib-SDL3.txt stage/keepers-hour/licences/SDL3-Zlib.txt
      - name: the packaged game runs in place
        shell: bash
        env:
          SDL_VIDEODRIVER: offscreen
          KEEPERS_SMOKE: "1"
        run: |
          ldd stage/keepers-hour/keepers-hour | grep -q "libSDL3.so.0 => $PWD/stage/keepers-hour/libSDL3.so.0"
          out=$(cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/stage/keepers-hour/keepers-hour" 2>&1)
          echo "$out"
          grep -q '0 problems, run ok' <<<"$out"
          grep -q '3 of 3 reached, save ok' <<<"$out"
      - name: tar, hash and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="keepers-hour-${GITHUB_REF_NAME#keepers-v}-linux-x64.tar.gz"
          tar -czf "$name" -C stage keepers-hour
          sha256sum "$name" > "$name.sha256"
          gh release upload "$GITHUB_REF_NAME" "$name" "$name.sha256" --clobber
